buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0' // Adjust to latest supported
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.JRC.fitness'
    compileSdk 34

    defaultConfig {
        applicationId "com.JRC.fitness"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}
